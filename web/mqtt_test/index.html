<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>ESP32 MQTT Dashboard</title>
  <!-- Nhúng thư viện Paho MQTT trước -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    button { padding: 12px 24px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-on { background-color: #4CAF50; color: white; }
    .btn-off { background-color: #f44336; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Dữ liệu từ ESP32:</h2>
    <h1 id="data" style="color: #2196F3;">Đang chờ dữ liệu...</h1>

    <hr>

    <h2>Điều khiển LED (GPIO 2):</h2>
    <button class="btn-on" onclick="sendControl('ON')">Bật LED</button>
    <button class="btn-off" onclick="sendControl('OFF')">Tắt LED</button>
  </div>

  <!-- Nhúng file main.js sau -->
  <script src="main.js"></script>
</body>
</html>
